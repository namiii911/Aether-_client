name: Build AETHER Windows Installer

on:
  workflow_dispatch:
  push:
    paths:
      - "launcher-source/**"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: launcher-source
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: launcher-source/package.json

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer
        run: npm run dist:win

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: AETHER-CLIENT-Windows-Installer
          path: launcher-source/dist/*.exe
          if-no-files-found: error
          retention-days: 14
