name: Build AETHER Windows Installer
on:
  workflow_dispatch:
  push:
    branches: [electron-launcher-foundation]
    paths:
      - "package.json"
      - "electron/**"
      - "renderer/**"
      - ".github/workflows/build-windows.yml"
permissions:
  contents: read
  actions: write
jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Build Windows x64 installer
        run: npm run dist:win
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: AETHER-Launcher-Windows-x64
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
