name: Publish GLORY Windows Release

on:
  workflow_run:
    workflows: ["Build GLORY CLIENT for Windows"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write

jobs:
  windows-release:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact successful build commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read launcher version
        id: meta
        run: |
          VERSION=$(node -p "require('./launcher-source/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check that the build uploaded an installer
        id: artifact
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.payload.workflow_run.id
            });
            const found = data.artifacts.some(item =>
              item.name === 'GLORY-CLIENT-Windows-x64' && !item.expired
            );
            core.setOutput('available', found ? 'true' : 'false');
            if (!found) core.notice('No Windows installer artifact was attached to this successful run; release publishing is safely skipped.');

      - name: Download the successful Windows installer artifact
        if: steps.artifact.outputs.available == 'true'
        uses: actions/download-artifact@v4
        with:
          name: GLORY-CLIENT-Windows-x64
          path: release-assets
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Publish installer to GitHub Releases
        if: steps.artifact.outputs.available == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          name: GLORY CLIENT ${{ steps.meta.outputs.version }}
          generate_release_notes: true
          make_latest: true
          overwrite_files: true
          files: release-assets/*.exe
          fail_on_unmatched_files: true
