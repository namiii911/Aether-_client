name: Publish AETHER Windows Release

on:
  workflow_run:
    workflows: ["Build AETHER CLIENT for Windows"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write

jobs:
  windows-release:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact successful build commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read launcher version
        id: meta
        run: |
          VERSION=$(node -p "require('./launcher-source/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download the successful Windows installer artifact
        uses: actions/download-artifact@v4
        with:
          name: AETHER-CLIENT-Windows-x64
          path: release-assets
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Publish installer to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          name: AETHER CLIENT ${{ steps.meta.outputs.version }}
          generate_release_notes: true
          make_latest: true
          overwrite_files: true
          files: release-assets/*.exe
          fail_on_unmatched_files: true
