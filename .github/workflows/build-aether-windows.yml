name: Build GLORY CLIENT for Windows

on:
  workflow_dispatch:
  push:
    paths:
      - "launcher-source/**"
      - ".github/workflows/build-glory-windows.yml"

permissions:
  contents: read

concurrency:
  group: glory-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: launcher-source
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate launcher JavaScript
        run: npm run check
      - name: Install launcher dependencies
        run: npm install --no-audit --no-fund
      - name: Package Windows x64 launcher
        run: npm run dist:win
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: GLORY-CLIENT-Windows-x64
          path: launcher-source/dist/*.exe
          if-no-files-found: error
          retention-days: 14
