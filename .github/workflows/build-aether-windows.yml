name: Build AETHER CLIENT for Windows

on:
  workflow_dispatch:
  push:
    paths:
      - "launcher-source/**"
      - ".github/workflows/build-aether-windows.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: launcher-source/package-lock.json
      - name: Install launcher dependencies
        working-directory: launcher-source
        run: npm install --no-audit --no-fund
      - name: Build Windows installer
        working-directory: launcher-source
        run: npm run dist:win
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: AETHER-CLIENT-Windows-Installer-v1.4.0
          path: launcher-source/dist/*.exe
          if-no-files-found: error
          retention-days: 14
