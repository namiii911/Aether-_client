name: Build AETHER CLIENT for Windows

on:
  workflow_dispatch:
  push:
    paths:
      - "launcher-source/**"
      - ".github/workflows/build-launcher.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: launcher-source
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build one-click Windows installer
        run: npm run dist:win
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: AETHER-CLIENT-Installer-Windows-x64-v1.4.2
          path: launcher-source/dist/AETHER-CLIENT-Setup-1.4.2.exe
          if-no-files-found: error
          retention-days: 30
