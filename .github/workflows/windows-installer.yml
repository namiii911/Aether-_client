name: Build and publish Windows installer

on:
  push:
    branches: [main]
    paths:
      - 'launcher-source/**'
      - '.github/workflows/windows-installer.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: launcher-source
        run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        working-directory: launcher-source
        run: npm run check
      - name: Build Windows installer
        working-directory: launcher-source
        run: npm run dist:win
      - name: Publish installer release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create v1.3.7 launcher-source/dist/GLORY-CLIENT-Setup-1.3.7.exe --repo "${{ github.repository }}" --title "GLORY CLIENT 1.3.7" --notes "Updated launcher navigation, account screens, settings persistence, and Windows installer."
          if [ $? -ne 0 ]; then
            gh release upload v1.3.7 launcher-source/dist/GLORY-CLIENT-Setup-1.3.7.exe --repo "${{ github.repository }}" --clobber
          fi
